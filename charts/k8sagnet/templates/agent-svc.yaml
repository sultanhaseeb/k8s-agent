{{- if .Values.agentSvc.enabled -}}
{{- $ctx := dict "root" . "component" "agent-svc" -}}
{{- $name := printf "%s-agent-svc" (include "k8sagnet.fullname" .) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "k8sagnet.labels" $ctx | nindent 4 }}
{{- if .Values.agentSvc.rbac.create }}
{{- range $ns := .Values.agentSvc.policy.allowedNamespaces }}
---
# Namespaced on purpose: the destructive grant exists only where policy allows
# it, rather than cluster-wide with the check living in application code.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "k8sagnet.labels" $ctx | nindent 4 }}
rules:
  # Delete is granted for pods only, and only in this namespace.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Read-only, so the chat can answer questions about other kinds.
  # Secrets are deliberately absent: "print the secret values" fails at the
  # API server rather than depending on the model's cooperation.
  - apiGroups: [""]
    resources:
      - services
      - configmaps
      - serviceaccounts
      - persistentvolumeclaims
      - endpoints
      - events
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "k8sagnet.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
# Managed settings outrank user settings, so the CLI cannot be talked out of
# this allowlist by anything written into the config volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-settings
  labels:
    {{- include "k8sagnet.labels" $ctx | nindent 4 }}
data:
  managed-settings.json: |
    {
      "permissions": {
        "allow": [
          "Bash(kubectl get:*)",
          "Bash(kubectl describe:*)",
          "Bash(kubectl delete pod:*)"
        ],
        "deny": [
          "Bash(kubectl delete namespace:*)",
          "Bash(kubectl delete node:*)",
          "Bash(kubectl apply:*)",
          "Bash(kubectl edit:*)",
          "Bash(curl:*)",
          "WebFetch",
          "WebSearch"
        ],
        "defaultMode": "default"
      }
    }
{{- if .Values.agentSvc.persistence.enabled }}
---
# Holds the CLI login so it survives restarts. RWO, hence one replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "k8sagnet.labels" $ctx | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.agentSvc.persistence.size }}
  {{- with .Values.agentSvc.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "k8sagnet.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.agentSvc.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "k8sagnet.selectorLabels" $ctx | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "k8sagnet.labels" $ctx | nindent 4 }}
spec:
  # Singleton: one login, one RWO volume, one task at a time.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "k8sagnet.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8sagnet.selectorLabels" $ctx | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $name }}
      securityContext:
        {{- toYaml .Values.agentSvc.securityContext | nindent 8 }}
      containers:
        - name: agent-svc
          image: "{{ .Values.agentSvc.image.repository }}:{{ .Values.agentSvc.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agentSvc.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.agentSvc.service.targetPort }}
          env:
            - name: ALLOWED_NAMESPACES
              value: {{ join "," .Values.agentSvc.policy.allowedNamespaces | quote }}
            - name: DENIED_NAMESPACES
              value: {{ join "," .Values.agentSvc.policy.deniedNamespaces | quote }}
            - name: TASK_TIMEOUT_SECONDS
              value: {{ .Values.agentSvc.taskTimeoutSeconds | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config
              mountPath: /home/node/.claude
            - name: managed-settings
              mountPath: /etc/claude-code
              readOnly: true
            # readOnlyRootFilesystem: the CLI and npm need writable scratch.
            - name: home
              mountPath: /home/node/.cache
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agentSvc.resources | nindent 12 }}
      volumes:
        - name: config
          {{- if .Values.agentSvc.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-config
          {{- else }}
          # Without a PVC the login is lost on every restart.
          emptyDir: {}
          {{- end }}
        - name: managed-settings
          configMap:
            name: {{ $name }}-settings
            items:
              - key: managed-settings.json
                path: managed-settings.json
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
