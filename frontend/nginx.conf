# Baked-in default so the image is runnable standalone. In-cluster the Helm
# chart mounts a ConfigMap over this file with the real service DNS names.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        return 503 '{"error":"no backend configured; run via the Helm chart"}';
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
